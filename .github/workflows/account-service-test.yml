name: account-service tests (mocked people-service)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'account-service/**'
      - 'people-service/openapi.yaml'
      - '.github/workflows/account-service-test.yml'
  pull_request:
    paths:
      - 'account-service/**'
      - 'people-service/openapi.yaml'
      - '.github/workflows/account-service-test.yml'

jobs:
  account-service-test:
    name: Run account-service tests (no .NET, no network)
    runs-on: ubuntu-latest        # no .NET SDK installed / used
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run account-service tests (mocked people-service)
        working-directory: account-service
        # WireMock + MockRestServiceServer + contract validation + in-memory H2, fully offline.
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-service-test-report
          path: account-service/build/reports/tests/test
