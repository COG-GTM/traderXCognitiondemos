name: E2E (Cypress)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  cypress-e2e:
    name: Angular UI end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start the full stack
        run: docker compose up -d --build

      - name: Wait for the UI ingress to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "ingress is up"; exit 0
            fi
            echo "waiting for http://localhost:8080 ($i)"; sleep 10
          done
          echo "ingress did not become healthy in time"; exit 1

      - name: Wait for account-service to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18088/account/ > /dev/null; then
              echo "account-service is up"; exit 0
            fi
            echo "waiting for http://localhost:18088/account/ ($i)"; sleep 10
          done
          echo "account-service did not become healthy in time"; exit 1

      - name: Install Angular front-end dependencies
        working-directory: web-front-end/angular
        run: npm install

      - name: Run Cypress e2e tests
        working-directory: web-front-end/angular
        env:
          CYPRESS_baseUrl: http://localhost:8080
        run: npm run e2e

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web-front-end/angular/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: web-front-end/angular/cypress/videos
          if-no-files-found: ignore

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
