apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: trade-feed
  name: trade-feed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-feed
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: trade-feed
    spec:
      containers:
        - image: traderx/trade-feed
          imagePullPolicy: IfNotPresent
          name: trade-feed
          env:
            - name: TRADE_FEED_PORT
              value: "18086"
            - name: TRADE_FEED_ALLOWED_ORIGINS
              value: "http://localhost:8080"
            - name: TRADE_FEED_ALLOW_ANONYMOUS_VIEWERS
              value: "true"
            - name: TRADE_FEED_TRADE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trade-feed-tokens
                  key: trade-service-token
            - name: TRADE_FEED_TRADE_PROCESSOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trade-feed-tokens
                  key: trade-processor-token
          ports:
            - containerPort: 18086
              protocol: TCP
          workingDir: /trade-feed
      restartPolicy: Always
