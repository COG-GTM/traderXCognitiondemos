apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  labels:
    app: database
spec:
  replicas: 2
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: database-app
        image: traderx/database
        imagePullPolicy: IfNotPresent
        env:
          - name: DATABASE_DBPASS
            valueFrom:
              secretKeyRef:
                name: traderx-database
                key: DATABASE_DBPASS
        ports:
          - containerPort: 18082
            protocol: TCP
