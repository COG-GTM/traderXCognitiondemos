apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: people-service
  name: people-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: people-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: people-service
    spec:
      containers:
        - name: people-service
          image: traderx/people-service
          env:
            - name: Authentication__ApiKeys
              valueFrom:
                secretKeyRef:
                  name: people-service-auth
                  key: api-key
                  optional: true
            - name: Authentication__Jwt__Authority
              valueFrom:
                secretKeyRef:
                  name: people-service-auth
                  key: jwt-authority
                  optional: true
            - name: Authentication__Jwt__Audience
              valueFrom:
                secretKeyRef:
                  name: people-service-auth
                  key: jwt-audience
                  optional: true
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18089
              protocol: TCP
      restartPolicy: Always
