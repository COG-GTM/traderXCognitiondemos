<div class="d-flex mb-4">
    <div class="card me-3" id="securityCountCard">
        <div class="card-body">
            <h6 class="card-subtitle mb-2">Securities held</h6>
            <h5 class="card-title mb-0" id="securityCountValue">{{ securityCount }}</h5>
        </div>
    </div>
    <div class="card" id="totalQuantityCard">
        <div class="card-body">
            <h6 class="card-subtitle mb-2">Total absolute quantity</h6>
            <h5 class="card-title mb-0" id="totalQuantityValue">{{ totalQuantity }}</h5>
        </div>
    </div>
</div>
