<h5>Trades <span class="text-secondary fs-6">({{ visibleCount }})</span></h5>

<ag-grid-angular style="width: 100%; height: 350px;" class="ag-theme-alpine" [columnDefs]="columnDefs"
    [rowData]="trades" (gridReady)="onGridReady($event)" [getRowId]="getRowId"
    [isExternalFilterPresent]="isExternalFilterPresent" [doesExternalFilterPass]="doesExternalFilterPass"
    (modelUpdated)="onModelUpdated($event)">
</ag-grid-angular>
