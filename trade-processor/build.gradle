plugins {
  id 'java'
  id 'org.springframework.boot' version '4.0.8'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'finos.traderx.trade-processor'
version = '0.0.1-SNAPSHOT'

ext['tomcat.version'] = '11.0.25'
ext['jackson-bom.version'] = '3.1.6'
ext['jackson-2-bom.version'] = '2.21.6'
ext['commons-lang3.version'] = '3.20.0'

java{
	sourceCompatibility = JavaVersion.VERSION_21
}

dependencies {
    
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.h2database:h2:2.2.224'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	
	implementation('org.json:json:20240303') {
		because 'previous versions are affected by multiple CVE'
	}
	implementation ('io.socket:socket.io-client:2.1.0'){
		exclude group: 'org.json', module: 'json'
	}
	constraints {
		implementation('com.squareup.okhttp3:okhttp:4.12.0') {
			because 'socket.io-client pulls okhttp 3.12.12 (CVE-2021-0341); Spring Boot 4 no longer manages okhttp'
		}
	}

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
  useJUnitPlatform()
}
