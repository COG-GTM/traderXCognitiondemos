plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'finos.traderx.trade-service'
version = '0.0.1-SNAPSHOT'

java{
	sourceCompatibility = JavaVersion.VERSION_21
}

ext['jackson-bom.version'] = '2.21.6'

dependencies {

	constraints {
		implementation('com.squareup.okhttp3:okhttp:4.12.0') {
			because 'socket.io-client pulls in okhttp 3.12.12, which is affected by CVE-2021-0341 and CVE-2023-0833'
		}
	}

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.h2database:h2:2.3.232'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	implementation('org.json:json:20260814') {
		because 'socket.io-client pulls in org.json 20090211, which is affected by multiple CVE'
	}
	implementation ('io.socket:socket.io-client:2.1.2') {
		exclude group: 'org.json', module: 'json'
	}

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
  useJUnitPlatform()
}
