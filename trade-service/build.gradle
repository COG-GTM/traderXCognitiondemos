plugins {
  id 'java'
  id 'org.springframework.boot' version '3.3.13'
  id 'io.spring.dependency-management' version '1.1.6'
}

group = 'finos.traderx.trade-service'
version = '0.0.1-SNAPSHOT'

java{
	sourceCompatibility = JavaVersion.VERSION_21
}

// Keep snakeyaml out of the app and unit-test classpaths (CVE hygiene) but allow the
// integrationTest source set to resolve it, as the OpenAPI/Swagger parser used by the
// contract tests requires it.
['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { cfg ->
  configurations.named(cfg).configure {
    exclude group: 'org.yaml', module: 'snakeyaml'
  }
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.h2database:h2:2.2.224'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	implementation('org.json:json:20240303') {
		because 'previous versions are affected by multiple CVE'
	}
	implementation ('io.socket:socket.io-client:2.1.0') {
		exclude group: 'org.json', module: 'json'
	}

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

sourceSets {
	integrationTest {
		java.srcDir 'src/integrationTest/java'
		resources.srcDir 'src/integrationTest/resources'
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	integrationTestImplementation 'org.awaitility:awaitility:4.2.1'
	integrationTestImplementation 'org.wiremock:wiremock-standalone:3.9.1'
	integrationTestImplementation 'com.corundumstudio.socketio:netty-socketio:2.0.9'
	integrationTestImplementation 'com.atlassian.oai:swagger-request-validator-core:2.40.0'
}

tasks.register('integrationTest', Test) {
	description = 'Runs service-to-service integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

tasks.named('test') {
  useJUnitPlatform()
}
