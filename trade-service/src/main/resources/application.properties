server.port=${TRADING_SERVICE_PORT:18092}
spring.threads.virtual.enabled=true

# Read-only access to the shared AccountUsers table, used to check that the caller may trade the order's account.
spring.datasource.url=jdbc:h2:tcp://${DATABASE_TCP_HOST:localhost}:${DATABASE_TCP_PORT:18082}/${DATABASE_NAME:traderx};CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DATABASE_DBUSER:sa}
spring.datasource.password=${DATABASE_DBPASS:sa}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none

people.service.url=${PEOPLE_SERVICE_URL:http://${PEOPLE_SERVICE_HOST:localhost}:18089}
account.service.url=${ACCOUNT_SERVICE_URL:http://${ACCOUNT_SERVICE_HOST:localhost}:18088}
reference.data.service.url=${REFERENCE_DATA_SERVICE_URL:http://${REFERENCE_DATA_HOST:localhost}:18085}

trade.feed.address=${TRADE_FEED_ADDRESS:http://${TRADE_FEED_HOST:localhost}:18086}

# To avoid "Request header is too large" when application is backed by oidc proxy.
server.max-http-request-header-size=1000000

logging.level.root=info

# POST /trade/ requires a JWT bearer token (e.g. forwarded by the OIDC proxy).
# Configure a JWK set URI (preferred) or an HS256 shared secret (>= 32 bytes);
# with neither set, every trade order is rejected with 401.
traderx.security.jwt.jwk-set-uri=${TRADE_SERVICE_JWT_JWK_SET_URI:}
traderx.security.jwt.hmac-secret=${TRADE_SERVICE_JWT_HMAC_SECRET:}
traderx.security.jwt.issuer=${TRADE_SERVICE_JWT_ISSUER:}
# Required when a JWK set URI is used, so tokens issued for other clients are rejected.
traderx.security.jwt.audience=${TRADE_SERVICE_JWT_AUDIENCE:}
# Claim matched against AccountUsers.Username; orders for accounts the user is not mapped to get 403.
traderx.security.jwt.username-claim=${TRADE_SERVICE_JWT_USERNAME_CLAIM:preferred_username}
# Comma-separated list of browser origins allowed to call the API cross-origin ("*" is ignored).
traderx.cors.allowed-origins=${TRADE_SERVICE_CORS_ALLOWED_ORIGINS:}
