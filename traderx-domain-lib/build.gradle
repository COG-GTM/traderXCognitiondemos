plugins {
  id 'java-library'
}

group = 'finos.traderx'
version = '1.0.0'

java {
	sourceCompatibility = JavaVersion.VERSION_21
}

dependencies {
	compileOnly 'io.swagger.core.v3:swagger-annotations:2.2.22'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}

tasks.named('test') {
  useJUnitPlatform()
}
