openapi: 3.0.1
info:
  title: "Account Service - TraderX"
  version: "1.0"
paths:
  /accountuser/:
    get:
      tags:
        - account-user-controller
      operationId: getAllAccountUsers
      description: "Gets all user-account mappings. Requires the admin bearer token."
      security:
        - adminToken: []
      responses:
        "401":
          description: Missing admin bearer token
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong admin token, or administration disabled (ACCOUNT_ADMIN_TOKEN unset)
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountUser"
    put:
      tags:
        - account-user-controller
      operationId: updateAccountUser
      description: "Creates or replaces a user-account mapping. Requires the admin bearer token; the username must exist in the People service."
      security:
        - adminToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUser"
        required: true
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AccountUser"
        "400":
          description: Missing accountId or malformed username
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing admin bearer token
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong admin token, or administration disabled (ACCOUNT_ADMIN_TOKEN unset)
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account or person not found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - account-user-controller
      operationId: createAccountUser
      description: "Creates a user-account mapping. Requires the admin bearer token; the username must exist in the People service."
      security:
        - adminToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUser"
        required: true
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AccountUser"
        "400":
          description: Missing accountId or malformed username
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing admin bearer token
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong admin token, or administration disabled (ACCOUNT_ADMIN_TOKEN unset)
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account or person not found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Mapping already exists
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  /account/:
    get:
      tags:
        - account-controller
      operationId: getAllAccount
      description: "Retrieves all accounts"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AccountList"
    put:
      tags:
        - account-controller
      operationId: updateAccount
      description: "Updates an account"

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Account"
        required: true
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Account"
    post:
      tags:
        - account-controller
      operationId: createAccount
      description: "Creates an account"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Account"
        required: true
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Account"
  /accountuser/{id}:
    get:
      tags:
        - account-user-controller
      operationId: getAccountUserById
      description: "Gets an account-user mapping. Requires the admin bearer token."
      security:
        - adminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AccountUser"
        "401":
          description: Missing admin bearer token
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong admin token, or administration disabled (ACCOUNT_ADMIN_TOKEN unset)
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Mapping not found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  /account/{id}:
    get:
      tags:
        - account-controller
      operationId: getAccountById
      description: "Gets an account by ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Account"
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: "Value of ACCOUNT_ADMIN_TOKEN (traderx.account-admin.token)"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      example:
        error: "Admin bearer token required"
    AccountList:
      type: array
      items:
        $ref: "#/components/schemas/Account"
      example:
        - id: 22214
          displayName: "test account 4"
        - id: 22215
          displayName: "test account 5"
    AccountUser:
      type: object
      properties:
        accountId:
          type: integer
          format: int32
          example: 22214
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,15}$"
          example: user02
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 22215
        displayName:
          type: string
          example: "test account 5"
