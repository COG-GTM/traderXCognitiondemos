# Test configuration: fully offline, in-memory H2, no external DB or people-service.
server.port=0

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Default people-service URL; WireMock-based tests override this via @DynamicPropertySource.
people.service.url=http://localhost:18089
# Short read timeout so the slow/timeout scenario fails fast and deterministically.
people.service.connect-timeout-ms=2000
people.service.read-timeout-ms=1000
