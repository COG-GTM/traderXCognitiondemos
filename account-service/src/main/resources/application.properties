server.port=${ACCOUNT_SERVICE_PORT:18088}

spring.datasource.url=jdbc:h2:tcp://${DATABASE_TCP_HOST:localhost}:${DATABASE_TCP_PORT:18082}/${DATABASE_NAME:traderx};CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DATABASE_DBUSER:sa}
spring.datasource.password=${DATABASE_DBPASS:sa}
spring.data.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.data.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.threads.virtual.enabled=true

# To avoid "Request header is too large" when application is backed by oidc proxy.
server.max-http-request-header-size=1000000

# Account API access. HTTP Basic users are only created when both username and password are set;
# with none configured every account endpoint rejects requests. Writes always require the admin user.
account.security.admin.username=${ACCOUNT_SERVICE_ADMIN_USERNAME:}
account.security.admin.password=${ACCOUNT_SERVICE_ADMIN_PASSWORD:}
account.security.reader.username=${ACCOUNT_SERVICE_READER_USERNAME:}
account.security.reader.password=${ACCOUNT_SERVICE_READER_PASSWORD:}
account.security.anonymous-reads=${ACCOUNT_SERVICE_ANONYMOUS_READS:false}
account.cors.allowed-origins=${ACCOUNT_SERVICE_CORS_ALLOWED_ORIGINS:http://localhost:18093,http://localhost:8080}

people.service.url=${PEOPLE_SERVICE_URL:http://${PEOPLE_SERVICE_HOST:localhost}:18089}
