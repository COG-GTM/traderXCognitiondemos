 * This file was generated by the Gradle 'init' task.
 *
 * This is a general purpose Gradle build.
 * Learn more about Gradle by exploring our samples at https://docs.gradle.org/8.0.2/samples
 */

plugins {
  id 'java'
  id 'org.springframework.boot' version '3.3.13'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'finos.traderx.account-service'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Managed dependency versions raised above the Spring Boot 3.3.13 defaults to pick up
// security fixes that are still binary compatible with the 3.3.x line.
ext['tomcat.version'] = '10.1.55'
ext['commons-lang3.version'] = '3.18.0'
ext['logback.version'] = '1.5.34'
ext['jackson-bom.version'] = '2.18.9'
ext['assertj.version'] = '3.27.7'
ext['xmlunit2.version'] = '2.10.0'

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.h2database:h2:2.3.232'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
}
