server.port=${POSITION_SERVICE_PORT:18090}

spring.datasource.url=jdbc:h2:tcp://${DATABASE_TCP_HOST:localhost}:${DATABASE_TCP_PORT:18082}/${DATABASE_NAME:traderx};CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DATABASE_DBUSER:sa}
spring.datasource.password=${DATABASE_DBPASS:sa}
spring.data.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.data.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.threads.virtual.enabled=true

# To avoid "Request header is too large" when application is backed by oidc proxy.
server.max-http-request-header-size=1000000

# Blotter endpoints require a JWT bearer token (e.g. forwarded by the OIDC proxy).
# Configure a JWK set URI (preferred) or an HS256 shared secret (>= 32 bytes);
# with neither set, every request to /positions and /trades is rejected.
traderx.security.jwt.jwk-set-uri=${POSITION_SERVICE_JWT_JWK_SET_URI:}
traderx.security.jwt.hmac-secret=${POSITION_SERVICE_JWT_HMAC_SECRET:}
traderx.security.jwt.issuer=${POSITION_SERVICE_JWT_ISSUER:}
traderx.security.jwt.audience=${POSITION_SERVICE_JWT_AUDIENCE:}
# Claim matched against AccountUsers.Username to decide account access.
traderx.security.jwt.username-claim=${POSITION_SERVICE_JWT_USERNAME_CLAIM:preferred_username}
# Claim listing roles; holders of the admin role may use GET /positions/ and GET /trades/.
traderx.security.jwt.roles-claim=${POSITION_SERVICE_JWT_ROLES_CLAIM:roles}
traderx.security.admin-role=${POSITION_SERVICE_ADMIN_ROLE:traderx-admin}
# Comma-separated list of browser origins allowed to call the API cross-origin ("*" is ignored).
traderx.cors.allowed-origins=${POSITION_SERVICE_CORS_ALLOWED_ORIGINS:}
