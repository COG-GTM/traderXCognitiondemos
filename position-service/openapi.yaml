openapi: 3.0.1
info:
  title: FINOS TraderX Position Service
  description: Service for retrieving blotter data, for trades and positions
  version: 0.1.0
servers:
  - url: ''
    description: Empty URL to help proxied documentation work
paths:
  /trades/{accountId}:
    get:
      tags:
        - trade-controller
      operationId: getByAccountId
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
  /trades/:
    get:
      tags:
        - trade-controller
      operationId: getAllTrades
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
  /positions/{accountId}:
    get:
      tags:
        - position-controller
      operationId: getByAccountId_1
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
  /positions/:
    get:
      tags:
        - position-controller
      operationId: getAllPositions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
  /audit/decisions:
    get:
      tags:
        - audit-controller
      summary: Query the best-execution audit trail
      description: >-
        Read-only, paged query over the immutable order decision records retained under
        MiFID II Art. 16(6) and RTS 27/28. Newest decision first. There is no mutation
        endpoint on this resource by design.
      operationId: getDecisions
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: security
          in: query
          required: false
          schema:
            type: string
        - name: decision
          in: query
          required: false
          schema:
            type: string
            enum: [ACCEPTED, REJECTED]
        - name: from
          in: query
          description: Inclusive lower bound on decisionTimestamp, ISO-8601 instant.
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive upper bound on decisionTimestamp, ISO-8601 instant.
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: Clamped to audit.query.max-page-size.
          required: false
          schema:
            type: integer
            format: int32
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          description: Unknown decision value, negative page, or 'to' before 'from'
        '503':
          description: Audit query API disabled by configuration
components:
  schemas:
    Trade:
      type: object
      properties:
        id:
          type: string
          example: 'ABC-123-XYZ'
        accountId:
          type: integer
          format: int32
          example: 22214
        security:
          type: string
          example: 'ADBE'
        side:
          type: string
          example: 'Buy'
        state:
          type: string
          example: 'New'
        quantity:
          type: integer
          format: int32
          example: 100
        updated:
          type: string
          format: date-time
        created:
          type: string
          format: date-time
    Position:
      type: object
      properties:
        accountId:
          type: integer
          format: int32
          example: 22214
        security:
          type: string
          example: 'ADBE'
        quantity:
          type: integer
          format: int32
          example: 100
        updated:
          type: string
          format: date-time
          example: '2020-01-01T00:00:00.000Z'
    AuditPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderDecision'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    OrderDecision:
      type: object
      properties:
        id:
          type: string
        correlationId:
          type: string
        orderId:
          type: string
        accountId:
          type: integer
          format: int32
          example: 22214
        security:
          type: string
          example: 'ADBE'
        side:
          type: string
          example: 'Buy'
        quantity:
          type: integer
          format: int32
        price:
          type: number
        priceSource:
          type: string
        notional:
          type: number
        decision:
          type: string
          enum: [ACCEPTED, REJECTED]
        reasonCode:
          type: string
          example: 'ACCOUNT_LIMIT_BREACHED'
        limitId:
          type: string
        limitType:
          type: string
        limitValue:
          type: number
        limitEffectiveFrom:
          type: string
          format: date-time
        submittedBy:
          type: string
        decisionTimestamp:
          type: string
          format: date-time
